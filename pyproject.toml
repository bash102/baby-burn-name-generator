[project]
name = "baby-burn-name-generator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "flask",
  "pyyaml",
  "pillow",
  "segno",
  "boto3",
  "brother_ql_next",
  "openai",
  "google-genai",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
